spring.application.name=accessing-data-mysql

# ========================================
# Database Configuration
# ========================================
# Default configuration uses environment variables for security
# For standard MySQL/MariaDB setup:
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/db_example
spring.datasource.username=${MYSQL_USER:springuser}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# WAMP Configuration (Alternative)
# ========================================
# For WAMP Server with MariaDB, uncomment and use these settings:
# spring.datasource.url=jdbc:mariadb://localhost:3306/db_example
# spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=
# Note: By default WAMP uses 'root' with no password

# ========================================
# Hibernate Configuration
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# For MariaDB, you can optionally use:
# spring.jpa.database-platform=org.hibernate.dialect.MariaDB103Dialect

# ========================================
# Server Configuration
# ========================================
# server.port=8080

# ========================================
# Logging (optional)
# ========================================
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
